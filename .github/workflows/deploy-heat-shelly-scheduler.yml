name: Deploy heat-shelly-scheduler

on:
  push:
    branches: [heat-shelly-nonheated]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Secret test: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
      - name: Deploy heat-shelly-scheduler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --keep-vars --config workers/heat-shelly-scheduler/wrangler.toml
